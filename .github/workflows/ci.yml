name: CI

# 规范仓库的门禁：协议 lint 与破坏性变更检查、生成物与源一致、向量可解析、运行器通过测试、
# 错误码登记表与清单 Schema 和正文、向量一致（tools/speccheck，ADR-0242）。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: 协议与运行器
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          # 破坏性变更检查需要基线提交
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: conformance/go.mod
          cache-dependency-path: |
            conformance/go.sum
            tools/speccheck/go.sum

      - name: 安装 buf 与生成器
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.75.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: 协议 lint
        run: buf lint

      - name: 协议格式
        run: buf format --diff --exit-code

      - name: 破坏性变更（PR 相对目标分支）
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

      # 规范的提交直接推到 main，只在 PR 上查等于从不查；推送时与推送前的那个提交比
      - name: 破坏性变更（推送相对推送前）
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: buf breaking --against ".git#ref=${{ github.event.before }}"

      - name: 生成物与源一致
        run: |
          buf generate
          # git diff 看不到新生成的未跟踪文件，用 status 一并查
          if [ -n "$(git status --porcelain -- conformance/internal)" ]; then
            git status --short -- conformance/internal
            git diff -- conformance/internal
            exit 1
          fi

      - name: 格式与静态检查
        working-directory: conformance
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      # 作业只在 Linux 上跑，带 windows 构建标签的文件（命名管道的拨号）不换目标系统就查不到
      - name: 静态检查（Windows 目标）
        working-directory: conformance
        run: GOOS=windows go vet ./...

      - name: 测试（向量、规则、运行器）
        working-directory: conformance
        run: go test -race ./...

      - name: 登记表与清单 Schema
        working-directory: tools/speccheck
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: 构建运行器
        working-directory: conformance
        run: go build -o bin/xihan-conformance ./cmd/xihan-conformance

      - name: 校验向量文件
        working-directory: conformance
        run: ./bin/xihan-conformance vectors
